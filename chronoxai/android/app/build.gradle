plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ---------------------------------------------------------------------------
// Firma de release.
//
// La clave vive FUERA del control de versiones (ver .gitignore). Se genera una
// sola vez con tools/generate_keystore.sh y no debe regenerarse nunca: Android
// identifica la app por applicationId + clave, así que cambiarla impide
// actualizar encima de una instalación previa.
//
// Si key.properties no existe (clon nuevo, CI sin secretos), la build sigue
// funcionando y firma con la clave de debug. Eso permite compilar, pero NO
// permite publicar ni actualizar una versión de release ya instalada.
// ---------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()

if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

android {
    namespace = "app.chronoxai"
    // PRoot y su loader se empaquetan en jniLibs/nativeLibraryDir para que el
    // rootfs pueda ejecutarse sin execve directo sobre filesDir en targetSdk 29+.
    compileSdk = 35
    ndkVersion = "27.2.12479018"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "app.chronoxai"
        minSdk = 24
        // PRoot y su loader en nativeLibraryDir evitan execve directo desde filesDir.
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }


    signingConfigs {
        if (hasReleaseSigning) {
            release {
                // La ruta de key.properties es relativa a android/, no al
                // módulo :app. Resolverla contra el módulo deja la ruta mal.
                def declared = keystoreProperties.getProperty("storeFile")
                def fromProject = rootProject.file(declared)
                storeFile = fromProject.exists() ? fromProject : file(declared)
                storePassword = keystoreProperties.getProperty("storePassword")
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")

                // v1+v2+v3: v1 (JAR) es imprescindible para Android < 7,
                // v2/v3 son las que usan las versiones modernas.
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug

            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            // applicationIdSuffix permite tener debug y release instaladas a la
            // vez sin que se pisen (y sin romper la firma de release).
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            // `useLegacyPackaging = true` + `extractNativeLibs="true"` hacen que
            // el instalador deje una COPIA EN DISCO de cada .so en
            // `nativeLibraryDir`. Es imprescindible: hay que poder hacer
            // `execve(libproot.so)` y exportar `LD_LIBRARY_PATH` hacia ese
            // directorio. Con el empaquetado moderno las librerías se mapean
            // desde el propio APK y no hay fichero que ejecutar.
            //
            // La alineación a 16 KB (Android 15) se resuelve en el ELF, no en el
            // zip: `tools/fetch_runtime.sh` rechaza cualquier binario cuyos
            // segmentos LOAD no estén alineados a 16 KB.
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

// Aviso claro en consola si se compila release sin clave real.
gradle.taskGraph.whenReady { taskGraph ->
    def buildingRelease = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (buildingRelease && !hasReleaseSigning) {
        logger.warn("")
        logger.warn("==============================================================")
        logger.warn(" AVISO: compilando RELEASE sin clave de firma real.")
        logger.warn(" Se usará la clave de DEBUG, que no sirve para actualizar")
        logger.warn(" una versión ya publicada.")
        logger.warn(" Ejecuta: ./tools/generate_keystore.sh")
        logger.warn("==============================================================")
        logger.warn("")
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}
